name: Auto Update VLESS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: vless-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # 🔥 УЛЬТРА стабильная установка sing-box
      - name: Install sing-box (ultra stable)
        run: |
          set -e

          echo "🔍 Получаю последний релиз..."

          API_URL="https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          DOWNLOAD_URL=$(curl -s $API_URL | grep browser_download_url | grep linux-amd64.tar.gz | cut -d '"' -f 4 | head -n 1)

          echo "📦 Найден архив:"
          echo $DOWNLOAD_URL

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ API не сработал → fallback"

            DOWNLOAD_URL="https://github.com/SagerNet/sing-box/releases/download/v1.12.0/sing-box-1.12.0-linux-amd64.tar.gz"
          fi

          echo "⬇️ Скачиваю..."
          wget -O sing-box.tar.gz $DOWNLOAD_URL

          echo "📂 Распаковываю..."
          tar -xzf sing-box.tar.gz

          echo "🔍 Ищу бинарь..."
          BIN_PATH=$(find . -type f -name sing-box | head -n 1)

          if [ -z "$BIN_PATH" ]; then
            echo "❌ sing-box не найден!"
            exit 1
          fi

          echo "📌 Найден: $BIN_PATH"

          mv $BIN_PATH ./sing-box
          chmod +x sing-box

          echo "✅ Проверка версии:"
          ./sing-box version

      # 📥 загрузка источников
      - name: Download sources
        shell: pwsh
        run: |
          $urls = @(
          "https://accargame.cfd/sub/tg7dzYH8Kxu-3BmE",
          "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
          
          )
          
          Remove-Item all_sources.txt -ErrorAction Ignore

          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"
              Invoke-WebRequest $url -OutFile temp.txt -TimeoutSec 15
              Get-Content temp.txt | Add-Content all_sources.txt
            }
            catch {
              Write-Host "Failed: $url"
            }
          }

      # ⚙️ запуск фильтра
      - name: Run filter
        shell: pwsh
        run: |
          ./filter.ps1

      # 💾 коммит результата
      - name: Commit results
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add vless_list_new.txt
          git add subnet_history.json

          if (git diff --cached --quiet) {
            Write-Host "No changes"
          }
          else {
            git commit -m "Auto update VLESS list"
            git push
          }
