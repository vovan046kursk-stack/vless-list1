name: Update VLESS + Clash

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Run filter
        shell: pwsh
        run: ./filter.ps1

      - name: Install subconverter
        run: |
          git clone https://github.com/tindy2013/subconverter.git
          cd subconverter
          chmod +x subconverter
          cd ..

      - name: Generate Clash YAML locally
        run: |
          cd subconverter
          ./subconverter \
          -g \
          -u ../filtered_vless.txt \
          -t clash \
          -o ../clash_pool.yaml
          cd ..

      - name: Validate YAML
        run: |
          if ! grep -q "proxies:" clash_pool.yaml; then
            echo "Invalid YAML generated"
            exit 1
          fi

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add filtered_vless.txt clash_pool.yaml
          git commit -m "Auto update pool" || echo "No changes"
          git push
