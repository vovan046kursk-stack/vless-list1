name: Auto Update VLESS (Whitelist + Ping + Failover)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===== Скачиваем источники =====
      - name: Download VLESS sources
        shell: pwsh
        run: |
          $urls = @(
            "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt"
          )

          Remove-Item all_sources.txt -ErrorAction Ignore

          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"
              Invoke-WebRequest $url -OutFile temp.txt
              Get-Content temp.txt | Add-Content all_sources.txt
            } catch {
              Write-Host "Failed: $url"
            }
          }

      # ===== Запускаем фильтр =====
      - name: Run filter (Whitelist + Ping)
        shell: pwsh
        run: |
          ./filter.ps1

      # ===== Коммитим изменения =====
      - name: Commit updated files
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add filtered_vless.txt
          git add vless_list_new.txt
          git add server_state.json

          if (git diff --cached --quiet) {
            Write-Host "No changes to commit"
          } else {
            git commit -m "Auto update: whitelist + ping + 2-fail removal"
            git push
          }
