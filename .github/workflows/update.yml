name: Update VLESS whitelist

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Run download_sources.ps1
        shell: pwsh
        run: ./download_sources.ps1

      - name: Run filter.ps1
        shell: pwsh
        run: ./filter.ps1

      - name: Commit updated TXT
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add filtered_vless.txt
          git add vless_list_new.txt

          git commit -m "Auto update VLESS whitelist" || echo "No changes"
          git push
