name: Auto Update VLESS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: vless-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Download sources
        shell: pwsh
        run: |
          $urls = @(
          "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt",
          "https://raw.githubusercontent.com/EtoNeYaProject/etoneyaproject.github.io/refs/heads/main/1"
          )
          
          Remove-Item all_sources.txt -ErrorAction Ignore

          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"
              Invoke-WebRequest $url -OutFile temp.txt -TimeoutSec 15
              Get-Content temp.txt | Add-Content all_sources.txt
            }
            catch {
              Write-Host "Failed: $url"
            }
          }

      - name: Run filter
        shell: pwsh
        run: |
          ./filter.ps1

      - name: Commit results
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add vless_list_new.txt
          git add subnet_history.json

          if (git diff --cached --quiet) {
            Write-Host "No changes"
          }
          else {
            git commit -m "Auto update VLESS list"
            git push
          }
