name: Update VLESS list

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run filter
      shell: pwsh
      run: |
        pwsh ./filter.ps1

    - name: Check changes
      run: |
        git status

    - name: Commit changes
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        git add vless_list_new.txt

        git commit -m "Auto update VLESS list" || echo "No changes"

        git push
