name: Auto update VLESS & Clash

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # ===== ОБНОВЛЯЕМ FILTERED =====
    - name: Run filter
      run: ./filter.ps1
      shell: pwsh

    # ===== TXT ПОДПИСКА (HAPP НЕ ЛОМАЕМ) =====
    - name: Update TXT subscription
      run: |
        Copy-Item filtered_vless.txt vless_list_new.txt -Force
      shell: pwsh

    # ===== ГЕНЕРАЦИЯ CLASH =====
    - name: Generate Clash YAML
      run: ./generate_clash.ps1
      shell: pwsh

    # ===== ПРОВЕРКА YAML =====
    - name: Validate Clash YAML
      run: |
        if (!(Test-Path clash_pool.yaml)) {
          Write-Host "clash_pool.yaml not found"
          exit 1
        }
        if (-not (Select-String -Path clash_pool.yaml -Pattern "proxies:")) {
          Write-Host "Invalid YAML generated"
          exit 1
        }
      shell: pwsh

    # ===== КОММИТ =====
    - name: Commit changes
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "Auto update subscription" || echo "No changes"
        git push
      shell: pwsh
