name: Auto Update VLESS Whitelist

permissions:
  contents: write

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Install PowerShell
      run: |
        sudo apt-get update
        sudo apt-get install -y powershell

    - name: Run download_sources.ps1
      run: pwsh -File ./download_sources.ps1

    - name: Extract IP:PORT from all_vless.txt
      run: pwsh -File ./extract_ip_port.ps1

    - name: Filter VLESS by ip_port_pool.txt
      run: pwsh -File ./filter.ps1

    - name: Commit updated TXT files
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add *.txt
        git commit -m "auto update whitelist" || exit 0
        git push
