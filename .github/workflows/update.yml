name: Update VLESS + Clash

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run filter
        shell: pwsh
        run: |
          ./filter.ps1

      - name: Generate Clash via Subconverter
        run: |
          curl -L "https://subconverter.vercel.app/sub?target=clash&url=https://raw.githubusercontent.com/${{ github.repository }}/main/filtered_vless.txt" -o clash_pool.yaml

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add filtered_vless.txt clash_pool.yaml
          git commit -m "Auto update pool" || echo "No changes"
          git push
