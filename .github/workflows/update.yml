name: Update VLESS & Generate Clash

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Скачиваем источники ---
      - name: Download sources
        run: |
          curl -L https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt -o source1.txt
          curl -L https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt -o source2.txt
          curl -L https://raw.githubusercontent.com/vsevjik/OBSpiskov/refs/heads/main/wwh_old -o source3.txt

      # --- Объединяем и оставляем только VLESS ---
      - name: Filter VLESS
        run: |
          cat source1.txt source2.txt source3.txt > all.txt
          grep "^vless://" all.txt > filtered_vless.txt || true
          echo "Filtered lines:"
          wc -l filtered_vless.txt

      # --- Устанавливаем subconverter ---
      - name: Install subconverter
        run: |
          wget https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xzf subconverter_linux64.tar.gz
          chmod +x subconverter/subconverter

      # --- Генерируем Clash YAML ---
      - name: Generate Clash YAML
        run: |
          ./subconverter/subconverter \
          -g \
          -u filtered_vless.txt \
          -t clash \
          -o clash_pool.yaml

      # --- Проверяем что YAML нормальный ---
      - name: Validate YAML
        run: |
          if grep -q "proxies:" clash_pool.yaml; then
            echo "YAML OK"
          else
            echo "Invalid YAML generated"
            exit 1
          fi

      # --- Коммит если есть изменения ---
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add filtered_vless.txt clash_pool.yaml
          git commit -m "Auto update VLESS + Clash" || echo "No changes"
          git push
