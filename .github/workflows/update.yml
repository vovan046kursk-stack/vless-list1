name: Update VLESS whitelist

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup PowerShell
        uses: actions/setup-powershell@v2

      - name: Download VLESS sources
        run: pwsh ./download_sources.ps1

      - name: Filter by whitelist IP:PORT
        run: pwsh ./filter.ps1

      - name: Commit updated TXT
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add filtered_vless.txt
          git add vless_list_new.txt

          git commit -m "Auto update VLESS whitelist" || echo "No changes"
          git push
