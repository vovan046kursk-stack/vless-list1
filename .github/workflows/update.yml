name: Auto Update VLESS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: vless-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # 🔥 установка sing-box
      - name: Install sing-box
        run: |
          wget https://github.com/SagerNet/sing-box/releases/latest/download/sing-box-linux-amd64.tar.gz
          tar -xzf sing-box-linux-amd64.tar.gz
          mv sing-box-*/sing-box ./sing-box
          chmod +x sing-box

      - name: Download sources
        shell: pwsh
        run: |
          $urls = @(
          "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt",
          "https://raw.githubusercontent.com/ByeWhiteLists/ByeWhiteLists2/refs/heads/main/ByeWhiteLists2.txt"
          )
          
          Remove-Item all_sources.txt -ErrorAction Ignore

          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"
              Invoke-WebRequest $url -OutFile temp.txt -TimeoutSec 15
              Get-Content temp.txt | Add-Content all_sources.txt
            }
            catch {
              Write-Host "Failed: $url"
            }
          }

      # 🔥 запуск фильтра (с sing-box внутри)
      - name: Run filter
        shell: pwsh
        run: |
          ./filter.ps1

      - name: Commit results
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add vless_list_new.txt
          git add subnet_history.json

          if (git diff --cached --quiet) {
            Write-Host "No changes"
          }
          else {
            git commit -m "Auto update VLESS list"
            git push
          }
