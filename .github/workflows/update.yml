name: Update VLESS list

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Filter VLESS
        shell: pwsh
        run: ./filter.ps1

      - name: Generate Clash config
        shell: pwsh
        run: ./generate_clash.ps1

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add vless_list_new.txt clash_pool.yaml
          git commit -m "auto update pool" || echo "no changes"
          git push

