name: Sync to GitVerse

on:
  schedule:
    - cron: "*/40 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Download file
        run: |
          curl -L "https://raw.githubusercontent.com/vovan046kursk-stack/vless-list1/refs/heads/main/vless_list_new.txt" -o new_file

      - name: Push to GitVerse
        run: |
          git clone https://oauth2:${{ secrets.GITVERSE_TOKEN }}@gitverse.ru/Benss/Vless.git repo
          cd repo
          mv ../new_file new_file
          git config user.name "sync-bot"
          git config user.email "bot@sync.com"
          git add new_file
          git commit -m "update subscription" || true
          git push
