proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - Fallback
      - Manual
      - DIRECT

  - name: Auto
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    use:
      - pool

  - name: Fallback
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    use:
      - pool

  - name: Manual
    type: select
    use:
      - pool

